# 随机端口启动，仅作为本机注册中心的演示/验证入口
server.port=0

# ===== 本机服务注册与负载均衡参数（全部内存态，无外部依赖）=====
# 实例默认租约 TTL：超过该时间未续约即判定过期
slb.lease-ttl-millis=15000
# 租约扫描间隔
slb.lease-sweep-millis=2000
# 后台健康探测间隔
slb.probe-interval-millis=1000
# 连续失败达到该次数摘除
slb.failure-threshold=3
# 摘除后连续成功达到该次数恢复
slb.success-threshold=2
# 本地回环 TCP 探测连接超时
slb.probe-connect-timeout-millis=300
