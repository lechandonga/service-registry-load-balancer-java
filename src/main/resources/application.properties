server.port=0
spring.application.name=service-registry-load-balancer

local-registry.default-ttl-millis=15000
local-registry.lease-sweep-interval-millis=500
local-registry.probe-interval-millis=1000
local-registry.probe-connect-timeout-millis=200
local-registry.failure-threshold=3
local-registry.recovery-threshold=2

logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.github.lechandonga=INFO
